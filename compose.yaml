services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attendify_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command:
      - sh
      - -c
      - |
        chown -R www-data:www-data storage bootstrap/cache
        exec php-fpm
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - attendify

  nginx:
    image: nginx:1.28-alpine
    container_name: attendify_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - attendify

  mariadb:
    image: mariadb:11.4
    container_name: attendify_mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-attendify}
      MARIADB_USER: ${DB_USERNAME:-attendify}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD harus diatur di file .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD harus diatur di file .env}
    volumes:
      - attendify_db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - attendify

networks:
  attendify:
    name: attendify_network

volumes:
  attendify_db_data:
    name: attendify_db_data
